name: Isolated slider accessibility experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slider-ax:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Isolated slider experiment
        run: swift test --build-system swiftbuild --jobs 2 --filter '^WupsyTests[.]WSSSliderAccessibilityExperimentTests/testFourVariantsAndExternalClient$'
